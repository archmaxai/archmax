# Recommended deployment — runs archmax with dedicated MongoDB and Redis services.
# 1. Copy .env.example to .env and fill in the required values.
# 2. Run: docker compose up -d

services:
  archmax:
    image: ghcr.io/archmaxai/archmax:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017/archmax
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:8080
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      UI_USERNAME: ${UI_USERNAME:-admin}
      UI_PASSWORD: ${UI_PASSWORD}
      AGENT_API_BASE_URL: ${AGENT_API_BASE_URL:-https://openrouter.ai/api/v1}
      AGENT_API_KEY: ${AGENT_API_KEY:-}  # Required for AI agent features
      AGENT_MODEL: ${AGENT_MODEL:-anthropic/claude-sonnet-4.6}
    volumes:
      - archmax-data:/data
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  mongo:
    image: mongo:8
    command: ["mongod", "--quiet"]
    logging:
      driver: none
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    logging:
      driver: none
    restart: unless-stopped

volumes:
  archmax-data:
  mongo-data:
