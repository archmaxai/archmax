name: PR Docker Build

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}
          build-args: APP_VERSION=pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comment on PR
        uses: actions/github-script@v9
        with:
          script: |
            const image = `ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}`;
            const body = [
              `### Docker image ready`,
              '',
              '```bash',
              `docker pull ${image}`,
              '```',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Docker image ready')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  e2e:
    name: E2E Tests
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      APP_IMAGE: ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v6

      - name: Generate random credentials
        run: |
          echo "UI_USERNAME=e2e_$(openssl rand -hex 4)" >> "$GITHUB_ENV"
          echo "UI_PASSWORD=$(openssl rand -base64 18)!" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start application stack
        run: |
          docker compose -f docker-compose.ci.yml --env-file /dev/null pull
          docker compose -f docker-compose.ci.yml --env-file /dev/null up -d
          echo "Waiting for health endpoint..."
          for i in $(seq 1 60); do
            STATUS=$(curl -sf http://localhost:8080/api/health 2>/dev/null | jq -r '.status // empty') || true
            if [ "$STATUS" = "healthy" ]; then
              echo "Application is healthy after ${i} attempts"
              exit 0
            fi
            echo "  Attempt $i/60: ${STATUS:-not ready}"
            sleep 5
          done
          echo "Application failed to become healthy"
          docker compose -f docker-compose.ci.yml --env-file /dev/null logs app
          docker compose -f docker-compose.ci.yml --env-file /dev/null logs mssql
          exit 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get update
          pnpm --filter @archmax/e2e exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @archmax/e2e test
        env:
          CI: true
          BASE_URL: http://localhost:8080
          E2E_USERNAME: ${{ env.UI_USERNAME }}
          E2E_PASSWORD: ${{ env.UI_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 14

      - name: Capture container logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.ci.yml --env-file /dev/null logs app > /tmp/app-logs.txt 2>&1
          docker compose -f docker-compose.ci.yml --env-file /dev/null logs > /tmp/all-logs.txt 2>&1

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: container-logs
          path: /tmp/*-logs.txt
          retention-days: 14

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.ci.yml --env-file /dev/null down -v
