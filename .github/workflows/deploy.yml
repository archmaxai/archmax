name: Post-Deploy Health Check

on:
  deployment_status:

jobs:
  health-check:
    name: Verify Deployment Health
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deployment URL
        id: url
        run: |
          TARGET_URL="${{ github.event.deployment_status.target_url }}"

          if [ -z "$TARGET_URL" ]; then
            echo "::warning::No target_url in deployment_status event, skipping health check"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            TARGET_URL="${TARGET_URL%/}"
            echo "health_url=${TARGET_URL}/api/health" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for routing
        if: steps.url.outputs.skip == 'false'
        run: sleep 30

      - name: Health check
        if: steps.url.outputs.skip == 'false'
        run: |
          URL="${{ steps.url.outputs.health_url }}"
          MAX_ATTEMPTS=20
          INTERVAL=15
          ATTEMPT=1
          LAST_RESPONSE=""

          echo "Checking $URL ..."

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            LAST_RESPONSE=$(curl -sf --max-time 10 "$URL" 2>&1) || true
            STATUS=$(echo "$LAST_RESPONSE" | jq -r '.status // empty' 2>/dev/null) || true

            if [ "$STATUS" = "healthy" ]; then
              echo "  Attempt $ATTEMPT: healthy"
              echo "All services healthy"
              exit 0
            fi

            echo "  Attempt $ATTEMPT/$MAX_ATTEMPTS: ${STATUS:-unreachable} - retrying in ${INTERVAL}s"
            ATTEMPT=$((ATTEMPT + 1))
            sleep "$INTERVAL"
          done

          echo "::error::Health check failed for $URL after $MAX_ATTEMPTS attempts"
          echo "Last response: $LAST_RESPONSE"
          exit 1
