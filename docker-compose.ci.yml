# CI and local E2E stack.
# Usage:  APP_IMAGE=ghcr.io/archmaxai/archmax:pr-42 docker compose -f docker-compose.ci.yml --env-file /dev/null up -d
# Credentials default to admin/testpass123 for local use (compose interpolation defaults).
# In CI the workflow generates random values and passes them via environment.

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/archmaxai/archmax:latest}
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017/archmax-e2e
      REDIS_URL: redis://redis:6379
      APP_BASE_URL: http://localhost:8080
      BETTER_AUTH_SECRET: e2e-test-secret-32chars-xxxxxxxxx
      ENCRYPTION_KEY: e2e-test-encrypt-key-32chars-xxxx
      UI_USERNAME: ${UI_USERNAME:-admin}
      UI_PASSWORD: ${UI_PASSWORD:-testpass123}
    tmpfs:
      - /data:uid=999,gid=999,mode=0755,exec
    volumes:
      - ./apps/e2e/fixtures/sqlite:/e2e-fixtures:ro
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mssql-init:
        condition: service_completed_successfully
      iceberg-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12

  mongo:
    image: mongo:8
    command: ["mongod", "--quiet"]

  redis:
    image: redis:8-alpine

  # ── Federated database services ──────────────────────────────────

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e_pass
      POSTGRES_DB: e2e_test
    volumes:
      - ./apps/e2e/fixtures/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d e2e_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: e2e_root
      MYSQL_USER: e2e
      MYSQL_PASSWORD: e2e_pass
      MYSQL_DATABASE: e2e_test
    volumes:
      - ./apps/e2e/fixtures/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ue2e", "-pe2e_pass"]
      interval: 3s
      timeout: 3s
      retries: 15

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "E2e_Str0ng!Pass"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "E2e_Str0ng!Pass", "-No", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "E2e_Str0ng!Pass"
    volumes:
      - ./apps/e2e/fixtures/mssql:/seed:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -No -Q "CREATE DATABASE e2e_test"
        /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -No -d e2e_test -i /seed/init.sql

  # ── Iceberg (Lakekeeper + MinIO) ──────────────────────────────────

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 10

  lakekeeper-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: lakekeeper
      POSTGRES_DB: lakekeeper
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakekeeper -d lakekeeper"]
      interval: 2s
      timeout: 3s
      retries: 10

  lakekeeper-migrate:
    image: vakamo/lakekeeper:latest
    command: ["migrate"]
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: "e2e-not-secure-encryption-key!!"
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:lakekeeper@lakekeeper-db:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:lakekeeper@lakekeeper-db:5432/lakekeeper
    depends_on:
      lakekeeper-db:
        condition: service_healthy
    restart: "no"

  lakekeeper:
    image: vakamo/lakekeeper:latest
    command: ["serve"]
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: "e2e-not-secure-encryption-key!!"
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:lakekeeper@lakekeeper-db:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:lakekeeper@lakekeeper-db:5432/lakekeeper
      LAKEKEEPER__LISTEN_PORT: "8181"
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 3s
      timeout: 3s
      start_period: 10s
      retries: 15

  iceberg-init:
    image: debian:bookworm-slim
    depends_on:
      lakekeeper:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      LAKEKEEPER_URL: http://lakekeeper:8181
      MINIO_URL: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./apps/e2e/fixtures/iceberg:/seed:ro
    entrypoint: ["/bin/bash", "/seed/init.sh"]

